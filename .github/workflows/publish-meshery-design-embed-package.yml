name: Publish Meshery Design Embed Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (for example: 0.4.1)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-meshery-design-embed
  cancel-in-progress: false

jobs:
  publish-package:
    name: Bundle and publish package
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: meshery-design-embed
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            meshery-design-embed
            .github
          sparse-checkout-cone-mode: false

      - name: Ensure workflow runs from the default branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "This workflow must be run from ${{ github.event.repository.default_branch }}."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@layer5"
          cache: npm
          cache-dependency-path: meshery-design-embed/package-lock.json

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: "Set Package Version"
        uses: reedyuk/npm-version@1.1.1
        with:
          version: ${{ inputs.version }}

      # - name: Set package version
      #   run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Bundle package
        run: npm run build

      - name: Publish package to npm with OIDC
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''  # Explicitly empty for OIDC

      - name: Commit published version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release meshery-design-embed ${{ inputs.version }}"
          git push origin HEAD:${GITHUB_REF_NAME}
